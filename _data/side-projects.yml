  name: money-py
  link: https://github.com/jidoly/money-py-public
  job_title: 실시간 자동매매 시스템 (개인 프로젝트 · Python/FastAPI/React)
  dates: 2026.02 ~ 운영 중   # 시작 시점은 실제에 맞게 조정
  quote: >
    신호 생성이 아니라 "거래 전 구간이 실제로 동작하는 것"에 집중 — 수집→발주→체결정합→청산→원장을 매 거래일 무인 완주하는 시스템
  description: |
    * **한국투자증권 Open API 기반 풀스택 자동매매**: 실시간 WebSocket 호가/체결 수집 → 신호 판정 → 발주 → 체결정합 → 청산 → 원장 기록까지 라이브 전 구간 구현
    * **체결정합 엔진 설계** — 브로커 미체결 조회가 불신뢰한 환경에서 잔고 스냅샷 델타 귀속으로 체결을 감지, 보유/매도가능 수량 분리 캐시로 청산 수량 클램프
    * **무인 운영을 위한 장애 내성**: 재접속 지수 백오프·워치독, 재기동 시 포지션 복원, 개장 자가복구(고아 포지션 정리), 포트 점유 체크 기반 중복 방지 런처
    * **실측 기반 백테스트**: 라이브 원장에서 실측한 슬리피지·비용 상수를 1분봉 백테스트 엔진의 입력으로 사용 — 비용을 못 이기는 전략을 데이터로 기각하고 전략 피벗
    * React 실시간 대시보드(신호 게이지·포지션·트레일 상태) + 에러 관측성(JSONL 영속화·Slack 알림)
