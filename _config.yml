about_content: | # this will include new lines to allow paragraphs
  **신규 SaaS 런칭부터 연매출 40억+ 규모 성장**, 그리고 대규모 커머스 서비스의 성능·안정성 개선까지 경험한 개발자 김지훈입니다.
  건국대학교 **소프트웨어 전공**을 졸업하고, 전국 단위 **공공데이터 공모전 우수상**을 수상했습니다.

  굿스플로 셀러스팀에서 **Spring Boot · React 기반 SaaS**를 설계하고,
  주문·배송·정산·요금제 등의 핵심 기능을 직접 구축했습니다.
  **20개 이상의 이커머스 플랫폼** 연동과 **월 300만 건 이상 배송** 처리,
  **Okta SSO · SCIM 연동**, **Redis · WebSocket 실시간 처리**, **AWS 기반 CI/CD** 등을 경험했습니다.

  현재 K2코리아 커머스시스템팀에서 **K-Village 회원·이벤트 도메인**과
  **대기열·오토스케일링 운영**을 담당하고 있습니다.
  마케팅 집중 트래픽에 대응하며 SQL 실행계획 기반 병목 분석과
  결제·장바구니·마일리지 조회 성능 개선을 주도했고,
  **ISMS-P 개인정보 보호 체계 개선** 업무도 진행 중입니다.

  직접 구현하는 역량과 함께 문제 원인을 분석하고 개선 방향을 이끄는 역량을 중요하게 생각합니다.

