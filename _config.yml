about_content: | # this will include new lines to allow paragraphs
  서비스 **신규 런칭부터 연매출 40억+ 규모 성장**까지 전 과정을 경험한 풀스택 개발자 김지훈입니다.  
  건국대학교 **소프트웨어 전공**을 졸업하고, 전국단위 **공공데이터 공모전 우수상**을 수상한 이력이 있습니다.  

  핌즈(주) 셀러스팀에서 **Spring Boot · React 기반 SaaS 아키텍처**를 설계하고,  
  주문·배송·정산·요금제 등 핵심 비즈니스 로직을 처음부터 직접 구축했습니다.  
  쿠팡 · 네이버 스마트스토어 등 **20개 이상의 이커머스 플랫폼**과 주요 택배사 연동을 개발해  
  **월 300만 건 이상의 배송**을 처리하는 시스템으로 키워냈으며,  
  **Okta 기반 SSO · SCIM 연동**을 주도해 엔터프라이즈 고객 확보의 기술적 기반을 만들었습니다.  

  **Redis · WebSocket 기반 실시간 처리**와 **AWS · Jenkins CI/CD**로 무중단 운영 환경을 구축하고,  
  **주 1회 배포**를 이어가며 서비스를 멈추지 않고 발전시켜왔습니다.  
  확장성과 유지보수성을 고려한 설계만큼이나 **소통**을 중요시 생각합니다.

