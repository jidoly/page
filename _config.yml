about_content: | # this will include new lines to allow paragraphs
  현재 **K2코리아 커머스시스템팀**에서 시간당 9만 명 이상의 방문 트래픽을 처리하는 K-Village 서비스의 회원·이벤트 도메인을 담당하며, **트래픽 대응 및 DB 성능 최적화**를 수행하고 있습니다.

  굿스플로(현 핌즈)에서 **Spring Boot · React 기반 SaaS 아키텍처를 설계하고, 주문·배송·정산 등 핵심 비즈니스 로직을 직접 구축한 경험**이 있습니다. **20개 이상의 이커머스 플랫폼 연동**을 개발하고, **월 배송 300만 건 · 연매출 40억+ 규모**로 성장하는 과정에 기여했습니다.

  **Redis · WebSocket 기반 실시간 처리, AWS CI/CD 환경 구축, SQL 성능 최적화** 등 다양한 기술적 문제를 해결해 왔으며, **기술적 완성도와 원활한 소통**을 중요하게 생각합니다.

